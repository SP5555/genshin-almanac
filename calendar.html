<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Eroisk">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar — Genshin Almanac</title>
  <link rel="stylesheet" type="text/css" href="css/reset.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="stylesheet" type="text/css" href="css/calendar.css">
</head>
<body>

  <header class="site-header not-selectable">
    <div class="site-header-inner container">
      <a href="index.html" class="site-brand">Genshin Almanac<span id="brandLiveDot" class="brand-live-dot" aria-hidden="true"></span></a>
      <nav class="page-nav">
        <a href="timeline.html" class="page-nav-link">Timeline</a>
        <a href="clocks.html" class="page-nav-link">Server Clocks</a>
        <a href="calendar.html" class="page-nav-link is-active">Calendar</a>
      </nav>
    </div>
  </header>

  <main id="calendarRoot" class="calendar-root">
    <div class="container">

      <section class="calendar-intro">
        <h1 class="calendar-title">Calendar</h1>
        <p class="calendar-subtitle">
          The same banner history, laid out as a year instead of a line.
        </p>
      </section>

      <div class="calendar-year-stepper not-selectable">
        <button type="button" class="calendar-year-arrow is-prev" aria-label="Previous year">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="calendar-year-label-wrap">
          <button type="button" class="calendar-year-label" aria-haspopup="true" aria-expanded="false"></button>
          <div class="calendar-year-popover" hidden></div>
        </div>
        <button type="button" class="calendar-year-arrow is-next" aria-label="Next year">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="calendar-today-btn">Today</button>
      </div>

      <div class="calendar-month-grid" id="calendarMonthGrid"></div>

      <!-- Same stepper repeated below the grid — on mobile, after scrolling
           through all 12 months, going back to the top just to change year
           is real friction. Opens its popover upward (see calendar.css),
           since downward here would push toward the footer. -->
      <div class="calendar-year-stepper is-bottom not-selectable">
        <button type="button" class="calendar-year-arrow is-prev" aria-label="Previous year">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="calendar-year-label-wrap">
          <button type="button" class="calendar-year-label" aria-haspopup="true" aria-expanded="false"></button>
          <div class="calendar-year-popover" hidden></div>
        </div>
        <button type="button" class="calendar-year-arrow is-next" aria-label="Next year">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="calendar-today-btn">Today</button>
      </div>

    </div>
  </main>

  <div id="detailPanelBackdrop" class="detail-panel-backdrop"></div>
  <aside id="detailPanel" class="detail-panel" aria-hidden="true">
    <div class="detail-panel-grabber" id="detailPanelGrabber" aria-hidden="true"></div>
    <div class="detail-panel-topbar">
      <button class="detail-panel-back" id="detailPanelBack" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="detail-panel-close" id="detailPanelClose" aria-label="Close day details">&times;</button>
    </div>
    <div class="detail-panel-header" id="detailPanelHeader"></div>
    <div class="detail-panel-content" id="detailPanelContent"></div>
  </aside>

  <footer class="site-footer not-selectable">
    <div class="container footer-inner">
      <span class="footer-brand-name">Genshin Almanac</span>
      <p class="footer-tagline">An unofficial fan project, and one Traveler's excuse to never log off.</p>
      <p class="footer-meta">
        <a href="https://github.com/SP5555/genshin-almanac" target="_blank" rel="noopener" class="footer-link">GitHub</a>
        <span class="footer-divider">·</span>
        Not affiliated with or endorsed by HoYoverse.
      </p>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top not-selectable" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script src="js/shared.js"></script>
  <script src="js/calendar.js"></script>

</body>
</html>
