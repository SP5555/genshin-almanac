<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="author" content="Eroisk">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline — Genshin Almanac</title>
  <link rel="stylesheet" type="text/css" href="css/reset.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>

  <div class="region-bg" id="regionBgA"></div>
  <div class="region-bg" id="regionBgB"></div>

  <header class="site-header not-selectable">
    <div class="site-header-inner container">
      <a href="index.html" class="site-brand">Genshin Almanac<span id="brandLiveDot" class="brand-live-dot" aria-hidden="true"></span></a>
      <nav class="page-nav">
        <a href="timeline.html" class="page-nav-link is-active">Timeline</a>
        <a href="clocks.html" class="page-nav-link">Server Clocks</a>
      </nav>
    </div>
  </header>

  <nav class="version-nav not-selectable" id="versionNav"></nav>

  <div class="char-search" id="charSearch">
    <div class="char-search-bar">
      <span class="char-search-icon" aria-hidden="true"></span>
      <input type="text" class="char-search-input" id="charSearchInput" placeholder="Search characters..." autocomplete="off" aria-label="Search characters">
    </div>
    <div class="char-search-results" id="charSearchResults"></div>
  </div>

  <main id="timelineRoot" class="timeline-root"></main>

  <div id="charPanelBackdrop" class="char-panel-backdrop"></div>
  <aside id="charPanel" class="char-panel" aria-hidden="true">
    <div class="char-panel-grabber" id="charPanelGrabber" aria-hidden="true"></div>
    <div class="char-panel-topbar">
      <button class="char-panel-close" id="charPanelClose" aria-label="Close character details">&times;</button>
    </div>
    <div class="char-panel-header" id="charPanelHeader"></div>
    <div class="char-panel-content" id="charPanelContent"></div>
  </aside>

  <footer class="site-footer not-selectable">
    <div class="container footer-inner">
      <span class="footer-brand-name">Genshin Almanac</span>
      <p class="footer-tagline">An unofficial fan project tracking Genshin Impact's banner history.</p>
      <p class="footer-meta">
        <a href="https://github.com/SP5555/genshin-almanac" target="_blank" rel="noopener" class="footer-link">GitHub</a>
        <span class="footer-divider">·</span>
        Not affiliated with or endorsed by HoYoverse.
      </p>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top not-selectable" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M5 12l7-7 7 7"/>
    </svg>
  </button>

  <script src="js/shared.js"></script>
  <script src="js/glow-config.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
